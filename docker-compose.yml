# Колледж серверінде іске қосу: cp .env.example .env (мәндерін толтырыңыз), сосын
#   docker compose up -d --build
# Демо деректер керек болса (бір рет):  docker compose exec app npm run db:seed
# Алғашқы әкімші:  docker compose exec app npm run admin:create -- it@jihc.edu.kz "Аты-жөні"
# Дерекқор жоспары, резервтік көшірме және қалпына келтіру: docs/DATABASE.md
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: jihc
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: jihc
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jihc"]
      interval: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql://jihc:${POSTGRES_PASSWORD:-change-me}@db:5432/jihc
      UPLOAD_DIR: /data/uploads
    # Сыртқа тек Caddy (HTTPS) арқылы; 3000 порты тек сервердің өзінде ашық (тексеру үшін)
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - uploads:/data/uploads

  # HTTPS: my.jihc.edu.kz сертификатын өзі алады (Caddyfile). DOMAIN .env ішінде.
  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
    environment:
      DOMAIN: ${DOMAIN:-my.jihc.edu.kz}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  # Күн сайын 02:00-де pg_dump + справкалар архиві ./backups қалтасына (scripts/backup.sh).
  # ./backups қалтасын серверден тыс жерге де көшіріп тұрыңыз (docs/DATABASE.md).
  backup:
    image: postgres:16
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: jihc
      PGPASSWORD: ${POSTGRES_PASSWORD:-change-me}
      PGDATABASE: jihc
      TZ: Asia/Almaty
      BACKUP_AT: "02:00"
      KEEP_DAYS: "30"
    entrypoint: ["sh", "/backup.sh"]
    volumes:
      - ./scripts/backup.sh:/backup.sh:ro
      - ./backups:/backups
      - uploads:/uploads:ro

volumes:
  pgdata:
  uploads:
  caddy_data:
  caddy_config:
