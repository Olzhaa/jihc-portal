# Колледж серверінде іске қосу: cp .env.example .env (мәндерін толтырыңыз), сосын
#   docker compose up -d --build
# Демо деректер керек болса (бір рет):  docker compose exec app npm run db:seed
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: jihc
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: jihc
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jihc"]
      interval: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql://jihc:${POSTGRES_PASSWORD:-change-me}@db:5432/jihc
      UPLOAD_DIR: /data/uploads
    ports:
      - "3000:3000"
    volumes:
      - uploads:/data/uploads

volumes:
  pgdata:
  uploads:
